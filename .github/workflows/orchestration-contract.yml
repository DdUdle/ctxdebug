name: Orchestration contract tests

on:
  push:
    branches:
      - main
      - fix/x64dbg-orchestration-contract
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run x64dbg orchestration contract tests
        run: python -m pytest -q tests/test_x64_orchestration_contract.py tests/test_ida_client.py
