name: Orchestration contract tests

on:
  push:
    branches:
      - main
      - fix/x64dbg-orchestration-contract
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without marketplace actions
        shell: bash
        run: |
          set -euxo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Run contract tests with system Python
        shell: bash
        run: |
          set -euxo pipefail
          python3 --version
          python3 -m pip install --user -e ".[dev]"
          python3 -m pytest -q tests/test_x64_orchestration_contract.py tests/test_ida_client.py
